<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapShoot Classic</title>
    <meta name="description" content="키보드·터치로 즐기는 3D 11대11 축구 게임. 가상의 팀과 함께 패스하고 슛하며 골에 도전하세요." />
    <meta name="theme-color" content="#101b2d" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://inticoy.github.io/snapshoot-classic/" />
    <meta property="og:title" content="SnapShoot Classic · 3D 11대11 축구" />
    <meta property="og:description" content="키보드·터치로 즐기는 3D 11대11 축구 게임. 가상의 팀과 함께 패스하고 슛하며 골에 도전하세요." />
    <meta property="og:image" content="https://inticoy.github.io/snapshoot-classic/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SnapShoot Classic의 3D 축구 경기 화면" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SnapShoot Classic · 3D 11대11 축구" />
    <meta name="twitter:description" content="키보드·터치로 즐기는 3D 11대11 축구 게임. 패스하고 슛하며 골에 도전하세요." />
    <meta name="twitter:image" content="https://inticoy.github.io/snapshoot-classic/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/theme.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="hud" class="hidden">
        <!-- 스코어보드 -->
        <div class="sb">
          <div class="sb-clock" id="clock">00:00</div>
          <div class="sb-main">
            <span class="sb-team"><i class="chip home"></i><b id="abbr-h">HOM</b><span class="sb-reds" id="reds-h"></span></span>
            <span class="sb-score" id="score-h">0</span>
            <span class="sb-score" id="score-a">0</span>
            <span class="sb-team"><span class="sb-reds" id="reds-a"></span><b id="abbr-a">AWY</b><i class="chip away"></i></span>
          </div>
          <div class="sb-added" id="added"></div>
        </div>
        <div class="sb-pk" id="pk-tally"></div>
        <div class="card-pop" id="card-pop"><i></i><span></span></div>
        <div class="ticker" id="ticker"></div>

        <!-- 조종 중인 선수 -->
        <div class="pi" id="pi">
          <div class="pi-name" id="pi-name"></div>
          <div class="pi-stamina"><div id="pi-stamina"></div></div>
          <div class="pi-arrow"></div>
        </div>
        <div class="power" id="power">
          <span class="power-label" id="power-label">SHOT</span>
          <div class="power-track"><div class="power-fill" id="power-fill"></div><i class="power-mark"></i></div>
        </div>

        <canvas id="radar" width="220" height="140"></canvas>
        <div class="hints" id="hints"></div>

        <!-- 하단 선수 이름 바 (왼쪽: 내 선수, 오른쪽: 상대 선수) -->
        <div class="nb nb-left" id="nb-left"></div>
        <div class="nb nb-right" id="nb-right"></div>

        <div class="goal-word" id="goal-word">GOAL</div>
        <div class="lower-third" id="lower-third">
          <div class="lt-strip" id="lt-strip"></div>
          <div class="lt-body">
            <div class="lt-title" id="lt-title">GOAL</div>
            <div class="lt-sub" id="lt-sub"></div>
          </div>
          <div class="lt-score" id="lt-score"></div>
        </div>
      </div>

      <div id="overlay" class="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
