<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motion Lab</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #0d0f13; --panel: #14171d; --line: rgba(255, 255, 255, 0.08); --text: #e9ecf1; --muted: #8b93a1; --accent: #ffd400; }
      * { box-sizing: border-box; margin: 0; }
      body { background: var(--bg); color: var(--text); font: 500 13px/1.4 'Pretendard Variable', Pretendard, system-ui, sans-serif; height: 100vh; display: grid; grid-template-columns: 300px 1fr; overflow: hidden; }
      aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px 12px 40px; }
      h1 { font: 800 22px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.04em; margin: 0 4px 4px; }
      .sub { color: var(--muted); margin: 0 4px 14px; font-size: 12px; }
      .filter { width: 100%; margin-bottom: 12px; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--line); background: #0d0f13; color: var(--text); font: inherit; }
      details { border-top: 1px solid var(--line); padding: 8px 0; }
      summary { cursor: pointer; font-weight: 700; padding: 4px; display: flex; justify-content: space-between; list-style: none; }
      summary::-webkit-details-marker { display: none; }
      summary small { color: var(--muted); font-weight: 500; }
      .src { font: 700 10px/1 'Pretendard Variable', sans-serif; letter-spacing: 0.1em; color: var(--accent); margin: 14px 4px 4px; }
      .list { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 2px 2px; }
      .list button { border: 1px solid var(--line); background: #1b1f27; color: var(--text); font: 500 12px/1 inherit; padding: 7px 8px; border-radius: 3px; cursor: pointer; }
      .list button:hover { border-color: rgba(255, 255, 255, 0.3); }
      .list button.on { background: var(--accent); color: #111; border-color: var(--accent); }
      main { position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      .bar { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 14px; align-items: center; padding: 10px 14px; background: rgba(13, 15, 19, 0.85); border-radius: 4px; }
      .bar b { font: 700 16px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.03em; }
      .bar label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
      .bar input[type='range'] { width: 220px; }
      .bar .grow { flex: 1; }
      #status { position: absolute; top: 16px; left: 16px; color: var(--muted); }
      #legend { position: absolute; top: 16px; right: 16px; color: var(--muted); text-align: right; font-size: 12px; }
    </style>
  </head>
  <body>
    <aside>
      <h1>MOTION LAB</h1>
      <p class="sub">동작을 누르면 우리 선수에게 입혀서 재생합니다. 오른쪽 선은 원본 관절.</p>
      <input class="filter" id="filter" placeholder="검색 (예: pass, 트래핑, sprint)" />
      <div id="menu"></div>
    </aside>
    <main>
      <canvas id="view"></canvas>
      <div id="status">불러오는 중…</div>
      <div id="legend">드래그: 회전 · 휠: 확대</div>
      <div class="bar">
        <b id="clip-name">—</b>
        <span class="grow"></span>
        <label><input type="range" id="scrub" min="0" max="1" step="0.001" value="0" /></label>
        <span id="time">0.00s</span>
        <label>속도 <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>1.5</option></select></label>
        <label><input type="checkbox" id="inplace" /> 제자리</label>
        <label><input type="checkbox" id="skeleton" checked /> 원본 관절</label>
        <label><input type="checkbox" id="pause" /> 정지</label>
      </div>
    </main>
    <script type="module" src="/src/motions/main.ts"></script>
  </body>
</html>
